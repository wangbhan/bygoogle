name: bygoogle

services:
  frontend:
    build: ./frontend
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      API_ORIGIN: http://backend:8000
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [web]

  backend:
    build: ./backend
    environment:
      PGHOST: database
      PGDATABASE: maigu
      PGUSER: maigu_app
      PGPASSWORD: "${MAIGU_DB_PASSWORD:?Set MAIGU_DB_PASSWORD in .env}"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [web, data]

  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: maigu
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      MAIGU_DB_PASSWORD: "${MAIGU_DB_PASSWORD:?Set MAIGU_DB_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/01-app-role.sql:/docker-entrypoint-initdb.d/01-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$${MAIGU_DB_PASSWORD}\" psql -h 127.0.0.1 -U maigu_app -d maigu -w -Atqc 'SELECT 1'"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks: [data]

networks:
  web:
  data:
    internal: true

volumes:
  postgres_data:
